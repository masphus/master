<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MONA - Chat Hybrid Full</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{background:#ece5dd;display:flex;flex-direction:column;height:100dvh}
  #head{background:#111;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
  #head img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  #head b{font-size:16px}
  #head span{font-size:11px;color:#25d366}
  #status{font-size:11px;color:#888;text-align:center;padding:5px;background:#fff3cd}
  #chat{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;max-width:90%}
  .row.me{justify-content:flex-end;align-self:flex-end}
  .avatar{width:36px;height:36px;min-width:36px;border-radius:50%;object-fit:cover}
  .msg{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word}
  .msg.bot{background:#fff;color:#111}
  .msg.me{background:#dcf8c6;color:#111}
  #box{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;z-index:99}
  #pesan{flex:1;padding:14px;border-radius:20px;border:1px solid #ddd;outline:none;font-size:15px;min-width:0}
  button{padding:12px 18px;border:none;border-radius:20px;background:#111;color:#fff;font-weight:bold;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="head">
  <img src="mona.png" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100'">
  <div><b>MONA</b><br><span>● Online - Hybrid</span></div>
</div>
<div id="status">Memuat otak Mona Hybrid...</div>
<div id="chat"></div>
<div id="box">
  <input id="pesan" placeholder="Ketik pesan..." autocomplete="off">
  <button onclick="kirim()">Kirim</button>
</div>
<script>
const SUPABASE_URL = 'https://msfzsebownnsrpyjusoc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7VQcQXBLz4OYn_OJUzusSg_Zz1or9gq';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const chat = document.getElementById('chat');
const input = document.getElementById('pesan');
const statusEl = document.getElementById('status');

let DB = { penentu:[], kunci:[], frasa:[], rules:[], sinonim:[], mona_kata:[], mona_aturan:[] };
let otakReady = false;

function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }

// === BACA TABEL ANTI ERROR ===
// 1 tabel salah nama / belum dibikin / RLS kekunci -> balik [], jangan bikin semua gagal
// Gak ada SELECT * sendirian, semua selalu ada kolomnya
async function bacaTabel(namaTabel, kolom){
  try{
    let res = await supabaseClient.from(namaTabel).select(kolom);
    if(res.error){
      console.log('Tabel ' + namaTabel + ' gagal dibaca:', res.error.message);
      return [];
    }
    return res.data || [];
  }catch(e){
    console.log('Tabel ' + namaTabel + ' error:', e);
    return [];
  }
}

async function getOtak(){
  if(otakReady) return DB;
  statusEl.textContent = 'Menghubungi Supabase Hybrid...';
  // Baca satu-satu, JANGAN Promise.all, biar 1 gagal gak semua gagal
  DB.penentu = await bacaTabel('kata_penentu', 'kategori,kata');
  DB.kunci = await bacaTabel('kata_kunci', 'kategori,kata1,kata2');
  DB.frasa = await bacaTabel('frasa', 'kategori,teks');
  DB.rules = await bacaTabel('bot_rules', 'kategori,jawaban');
  DB.sinonim = await bacaTabel('sinonim', 'kata_utama,daftar_sinonim');
  DB.mona_kata = await bacaTabel('mona_kata', 'kata,jenis');
  DB.mona_aturan = await bacaTabel('mona_aturan', 'arah_pertanyaan,pola,jenis_jawaban');
  // Cadangan kalo nama tabel beda
  if(DB.mona_kata.length === 0) DB.mona_kata = await bacaTabel('mona_kata_baru', 'kata,jenis');
  if(DB.mona_aturan.length === 0) DB.mona_aturan = await bacaTabel('mona_rules', 'arah_pertanyaan,pola,jenis_jawaban');

  otakReady = true;
  let totalLoad = DB.penentu.length + DB.kunci.length + DB.frasa.length + DB.mona_kata.length + DB.mona_aturan.length;
  let statusText = 'Hybrid siap: Penentu '+DB.penentu.length+' • Kunci '+DB.kunci.length+' • Frasa '+DB.frasa.length+' • MonaKata '+DB.mona_kata.length+' • Aturan '+DB.mona_aturan.length+' ✅';
  if(DB.mona_kata.length === 0) statusText += ' | MonaKata kosong, cek nama tabel!';
  if(totalLoad === 0){
    statusText = 'Semua tabel gagal dibaca, cek RLS / nama tabel ⚠️ Tapi chat tetep jalan';
    statusEl.style.background = '#f8d7da';
  } else {
    statusEl.style.background = '#d4edda';
  }
  statusEl.textContent = statusText;
  return DB;
}

// === HYBRID 1: RANGKAI DARI MONA_KATA, BUKAN AMBIL KALIMAT JADI ===
// mona_kata = gudang kata per kata, mona_aturan = pola urutan jenis
// Contoh pola: "persetujuan + pemanis + kemampuan + syarat + keberadaan + subjek"
// Hasilnya dirangkai di sini, bukan dari bot_rules!
function rangkaiDariMonaKata(pola){
  if(!pola || !DB.mona_kata || !DB.mona_kata.length) return null;
  let jenisList = pola.split('+').map(x=>norm(x)).filter(x=>x);
  let hasil = [];
  for(let jenis of jenisList){
    // Ambil 1 kata per jenis, DISTINCT biar gak dobel kayak ayolah tadi
    let calon = DB.mona_kata.filter(k=>norm(k.jenis)===jenis);
    if(calon.length){
      let pilih = calon[Math.floor(Math.random()*calon.length)];
      hasil.push(pilih.kata);
    }
  }
  if(!hasil.length) return null;
  return hasil.join(' ');
}

function cariPolaMona(nq){
  if(!DB.mona_aturan || !DB.mona_aturan.length) return null;
  for(let a of DB.mona_aturan){
    let kunciAturan = norm(a.arah_pertanyaan).split(' ').filter(x=>x.length>2);
    let cocok = kunciAturan.filter(k=>nq.includes(' '+k+' ')).length;
    if(cocok>0) return a;
  }
  return null;
}

// === HYBRID 2: RANGKAI DARI OTAK LAMA ===
function rangkaiKalimat(kataKetemu, kategori, pertanyaanAsli){
  let kataStr = (kataKetemu||[]).join(' ');
  let topik = kategori ? kategori.replace(/^tanya_|^sapaan_/,'').replace(/_/g,' ') : kataStr;
  if(!topik) topik = kataStr;
  let pembuka = ['Iya Kak,', 'Oh iya Kak,', 'Halo Kak,', 'Betul Kak,'][Math.floor(Math.random()*4)];
  let kalimat = pembuka + ' soal <b>' + topik + '</b> ya? ';
  if(kataKetemu.length >= 2) kalimat += 'Kakak nanya soal <b>' + kataStr + '</b>. ';
  else if(kataKetemu.length === 1) kalimat += 'Kakak nyebut kata <b>' + kataStr + '</b>. ';
  kalimat += 'Coba ceritain lebih detail dong Kak, biar Mona bisa bantu jawab soal ' + topik + ' dengan pas. Kakak maksudnya gimana soal ' + topik + ' itu?';
  return kalimat;
}

function cariJawaban(q){
  if(!DB) return null;
  let nq = ' ' + norm(q) + ' ';
  for(let s of (DB.sinonim || [])){
    let utama = norm(s.kata_utama);
    let list = String(s.daftar_sinonim||'').toLowerCase().split(/[,|]/).map(x=>norm(x));
    for(let sin of list){ if(sin && nq.includes(' '+sin+' ')) nq = nq.replace(' '+sin+' ', ' '+utama+' '); }
  }

  // HYBRID 1: MONA_KATA DULUAN (MANDIRI)
  if(DB.mona_aturan && DB.mona_aturan.length > 0){
    let aturan = cariPolaMona(nq);
    if(aturan && aturan.pola){
      let rangkai = rangkaiDariMonaKata(aturan.pola);
      if(rangkai){
        let final = rangkai.charAt(0).toUpperCase() + rangkai.slice(1);
        return final + ', Kak. Ada lagi yang mau Kakak tanya?';
      }
    }
  }

  // HYBRID 2: OTAK LAMA - FRASA DULU
  let bestFrasa = null, bestPanjang = 0;
  for(let f of (DB.frasa || [])){
    let teksFrasa = norm(f.teks);
    if(teksFrasa && nq.includes(' '+teksFrasa+' ')){ if(teksFrasa.length > bestPanjang){ bestPanjang = teksFrasa.length; bestFrasa = f; } }
  }
  if(bestFrasa) return rangkaiKalimat(norm(bestFrasa.teks).split(' '), bestFrasa.kategori, q);

  // HYBRID 2 LANJUTAN: PENENTU (2 poin) + KUNCI (1 poin)
  let skorKategori = {}; let kataPerKategori = {};
  for(let p of (DB.penentu || [])){
    if(p.kata && nq.includes(' '+norm(p.kata)+' ')){
      skorKategori[p.kategori] = (skorKategori[p.kategori]||0) + 2;
      if(!kataPerKategori[p.kategori]) kataPerKategori[p.kategori] = [];
      kataPerKategori[p.kategori].push(norm(p.kata));
    }
  }
  for(let k of (DB.kunci || [])){
    let k1 = norm(k.kata1), k2 = norm(k.kata2);
    if(k1 && nq.includes(' '+k1+' ')){ skorKategori[k.kategori] = (skorKategori[k.kategori]||0) + 1; if(!kataPerKategori[k.kategori]) kataPerKategori[k.kategori] = []; kataPerKategori[k.kategori].push(k1); }
    if(k2 && nq.includes(' '+k2+' ')){ skorKategori[k.kategori] = (skorKategori[k.kategori]||0) + 1; if(!kataPerKategori[k.kategori]) kataPerKategori[k.kategori] = []; kataPerKategori[k.kategori].push(k2); }
  }
  let bestKat = null, bestSkor = 0;
  for(let kat in skorKategori){ if(skorKategori[kat] > bestSkor){ bestSkor = skorKategori[kat]; bestKat = kat; } }
  if(bestKat) return rangkaiKalimat([...new Set(kataPerKategori[bestKat] || [])], bestKat, q);

  return null;
}

function tambah(teks, siapa){
  let row = document.createElement('div');
  row.className = 'row ' + (siapa==='me'?'me':'');
  if(siapa==='bot'){
    row.innerHTML = '<img src="mona.png" class="avatar" onerror="this.src=\'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100\'"><div class="msg bot"></div>';
    row.querySelector('.msg').innerHTML = teks;
  } else {
    row.innerHTML = '<div class="msg me"></div>';
    row.querySelector('.msg').textContent = teks;
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}
async function kirim(){
  let teks = input.value.trim();
  if(!teks) return;
  tambah(teks, 'me');
  input.value = '';
  let rowBot = tambah('Mona lagi mikir...', 'bot');
  let botMsg = rowBot.querySelector('.msg');
  if(!otakReady){ await getOtak(); }
  let jawaban = null;
  try{ jawaban = cariJawaban(teks); }catch(e){ console.log('cariJawaban error:', e); jawaban = null; }
  if(!jawaban){
    jawaban = 'Halo kak, aku Mona 🙏<br><br>Untuk "'+teks+'" aku belum nemu katanya di gudang. Boleh ceritain lebih detail nggak kak?';
    try{ await supabaseClient.from('bot_antrian').insert([{pertanyaan: teks, status: 'MENUNGGU'}]); }catch(e){ console.log('antrian gagal:', e); }
  }
  botMsg.innerHTML = jawaban;
  chat.scrollTop = chat.scrollHeight;
}
input.addEventListener('keydown', e=>{ if(e.key==='Enter') kirim(); });
tambah('Halo kak, aku Mona 🙏<br>Ada yang bisa aku bantu?', 'bot');
getOtak();
</script>
</body>
</html>
