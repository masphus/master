<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MONA - Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{background:#ece5dd;display:flex;flex-direction:column;height:100dvh}
  #head{background:#111;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
  #head img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  #head b{font-size:16px}
  #head span{font-size:11px;color:#25d366}
  #status{font-size:11px;color:#888;text-align:center;padding:5px;background:#fff3cd}
  #chat{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;max-width:90%}
  .row.me{justify-content:flex-end;align-self:flex-end}
  .avatar{width:36px;height:36px;min-width:36px;border-radius:50%;object-fit:cover}
  .msg{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word}
  .msg.bot{background:#fff;color:#111}
  .msg.me{background:#dcf8c6;color:#111}
  #box{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;z-index:99}
  #pesan{flex:1;padding:14px;border-radius:20px;border:1px solid #ddd;outline:none;font-size:15px;min-width:0}
  button{padding:12px 18px;border:none;border-radius:20px;background:#111;color:#fff;font-weight:bold;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="head">
  <img src="mona.png" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100'">
  <div><b>MONA</b><br><span>● Online</span></div>
</div>
<div id="status">Memuat otak Mona...</div>
<div id="chat"></div>
<div id="box">
  <input id="pesan" placeholder="Ketik pesan..." autocomplete="off">
  <button onclick="kirim()">Kirim</button>
</div>
<script>
// === DIGANTI KE PROJECT BARU ===
const SUPABASE_URL = 'https://msfzsebownnsrpyjusoc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7VQcQXBLz4OYn_OJUzusSg_Zz1or9gq';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const chat = document.getElementById('chat');
const input = document.getElementById('pesan');
const statusEl = document.getElementById('status');

// OTAK CADANGAN: Biar Mona bisa jawab walau Supabase lemot / gagal!
let OTAK_CADANGAN = [
  {kategori:'salam', jawaban:'Halo kak, aku Mona 🙏<br>Ada yang bisa aku bantu?'},
  {kategori:'alamat', jawaban:'Alamat kita di Jl. Braga No.88, Bandung kak 🙏<br>Buka setiap hari 09.00 - 21.00'},
  {kategori:'siapa', jawaban:'Aku Mona kak, asisten dari Panorama Indonesia 🙏'},
  {kategori:'harga', jawaban:'Untuk harga boleh tau produk yang mana kak? Biar aku cekin.'},
  {kategori:'jam', jawaban:'Kita buka setiap hari 09.00 - 21.00 kak 🙏'},
  {kategori:'makasih', jawaban:'Sama-sama kak 🙏 Senang bisa bantu!'},
];
let DB = { penentu:[], kunci:[], frasa:[], rules:[], sinonim:[] };
let otakReady = false;

function timeout(ms){ return new Promise(r=>setTimeout(()=>r(null), ms)); }

async function getOtak(){
  if(otakReady) return DB;
  statusEl.textContent = 'Menghubungi Supabase...';
  try{
    let [rPenentu, rKunci, rFrasa, rRules, rSinonim] = await Promise.all([
      Promise.race([supabaseClient.from('kata_penentu').select('kategori,kata'), timeout(3000)]),
      Promise.race([supabaseClient.from('kata_kunci').select('kategori,kata1,kata2'), timeout(3000)]),
      Promise.race([supabaseClient.from('frasa').select('kategori,teks'), timeout(3000)]),
      Promise.race([supabaseClient.from('bot_rules').select('kategori,jawaban'), timeout(3000)]),
      Promise.race([supabaseClient.from('sinonim').select('kata_utama,daftar_sinonim'), timeout(3000)]),
    ]);
    if(rPenentu && rPenentu.data) DB.penentu = rPenentu.data;
    if(rKunci && rKunci.data) DB.kunci = rKunci.data;
    if(rFrasa && rFrasa.data) DB.frasa = rFrasa.data;
    if(rRules && rRules.data) DB.rules = rRules.data;
    if(rSinonim && rSinonim.data) DB.sinonim = rSinonim.data;

    if(DB.rules.length || DB.penentu.length){
      otakReady = true;
      statusEl.textContent = 'Otak siap: Penentu ' + DB.penentu.length + ' • Kunci ' + DB.kunci.length + ' • Frasa ' + DB.frasa.length + ' • Rules ' + DB.rules.length + ' • Supabase ✅';
      statusEl.style.background = '#d4edda';
      return DB;
    }
    throw new Error('Supabase kosong / timeout');
  }catch(e){
    console.log('Supabase gagal:', e);
    statusEl.textContent = 'Supabase lambat / RLS terkunci, pake otak cadangan ⚠️';
    statusEl.style.background = '#f8d7da';
    otakReady = true;
    return DB;
  }
}

function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }

function cariJawaban(q){
  let nq = ' ' + norm(q) + ' ';
  for(let s of DB.sinonim){
    let utama = norm(s.kata_utama);
    let list = String(s.daftar_sinonim||'').toLowerCase().split(/[,|]/).map(x=>norm(x));
    for(let sin of list){
      if(sin && nq.includes(' '+sin+' ')) nq = nq.replace(' '+sin+' ', ' '+utama+' ');
    }
  }
  let skorKategori = {};
  for(let p of DB.penentu){
    if(p.kata && nq.includes(' '+norm(p.kata)+' ')) skorKategori[p.kategori] = (skorKategori[p.kategori]||0) + 10;
  }
  for(let k of DB.kunci){
    let k1 = norm(k.kata1), k2 = norm(k.kata2);
    if(k1 && nq.includes(' '+k1+' ')) skorKategori[k.kategori] = (skorKategori[k.kategori]||0) + 2;
    if(k2 && nq.includes(' '+k2+' ')) skorKategori[k.kategori] = (skorKategori[k.kategori]||0) + 3;
  }
  for(let f of DB.frasa){
    if(f.teks && nq.includes(' '+norm(f.teks)+' ')) skorKategori[f.kategori] = (skorKategori[f.kategori]||0) + 1;
  }
  let bestKat = null, bestSkor = 0;
  for(let kat in skorKategori){ if(skorKategori[kat] > bestSkor){ bestSkor = skorKategori[kat]; bestKat = kat; } }
  if(bestKat){
    let rule = DB.rules.find(r => norm(r.kategori) === norm(bestKat));
    if(rule) return rule.jawaban;
  }
  for(let c of OTAK_CADANGAN){ if(nq.includes(c.kategori)) return c.jawaban; }
  return null;
}

function tambah(teks, siapa){
  let row = document.createElement('div');
  row.className = 'row ' + (siapa==='me'?'me':'');
  if(siapa==='bot'){
    row.innerHTML = '<img src="mona.png" class="avatar" onerror="this.src=\'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100\'"><div class="msg bot"></div>';
    row.querySelector('.msg').innerHTML = teks;
  } else {
    row.innerHTML = '<div class="msg me"></div>';
    row.querySelector('.msg').textContent = teks;
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}
async function kirim(){
  let teks = input.value.trim();
  if(!teks) return;
  tambah(teks, 'me');
  input.value = '';
  let rowBot = tambah('Mona lagi mikir...', 'bot');
  let botMsg = rowBot.querySelector('.msg');
  if(!otakReady){ await getOtak(); }
  let jawaban = cariJawaban(teks);
  if(!jawaban){
    jawaban = 'Halo kak, aku Mona 🙏<br><br>Untuk "'+teks+'" aku belum nemu jawabannya. Boleh ceritain lebih detail nggak kak?';
    try{ await supabaseClient.from('bot_antrian').insert([{pertanyaan: teks, status: 'MENUNGGU'}]); }catch(e){ console.log(e); }
  }
  botMsg.innerHTML = jawaban;
  chat.scrollTop = chat.scrollHeight;
}
input.addEventListener('keydown', e=>{ if(e.key==='Enter') kirim(); });
tambah('Halo kak, aku Mona 🙏<br>Ada yang bisa aku bantu?', 'bot');
getOtak();
</script>
</body>
</html>
