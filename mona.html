<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MONA - Full Tabel Asli - URL Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{background:#ece5dd;display:flex;flex-direction:column;height:100dvh}
  #head{background:#111;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
  #head img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  #head b{font-size:16px}
  #head span{font-size:11px;color:#25d366}
  #status{font-size:11px;color:#888;text-align:center;padding:5px;background:#fff3cd}
  #chat{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;max-width:90%}
  .row.me{justify-content:flex-end;align-self:flex-end}
  .avatar{width:36px;height:36px;min-width:36px;border-radius:50%;object-fit:cover}
  .msg{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word}
  .msg.bot{background:#fff;color:#111}
  .msg.me{background:#dcf8c6;color:#111}
  .btn-salah{margin-top:8px;padding:6px 10px;border:1px solid #ddd;border-radius:12px;background:#fff7ed;font-size:11px;cursor:pointer}
  .analisa{margin-top:8px;padding:8px;background:#fef9c3;border-radius:10px;font-size:12px;line-height:1.4}
  #box{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;z-index:99}
  #pesan{flex:1;padding:14px;border-radius:20px;border:1px solid #ddd;outline:none;font-size:15px;min-width:0}
  button{padding:12px 18px;border:none;border-radius:20px;background:#111;color:#fff;font-weight:bold;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="head">
  <img src="mona.png" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100'">
  <div><b>MONA</b><br><span>● Online - Tabel Asli Ko</span></div>
</div>
<div id="status">Memuat bahan ajar asli Ko...</div>
<div id="chat"></div>
<div id="box">
  <input id="pesan" placeholder="Ketik pesan..." autocomplete="off">
  <button onclick="kirim()">Kirim</button>
</div>
<script>
const SUPABASE_URL = 'https://msfzsebownnsrpyjusoc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7VQcQXBLz4OYn_OJUzusSg_Zz1or9gq';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const chat = document.getElementById('chat');
const input = document.getElementById('pesan');
const statusEl = document.getElementById('status');
let DB = {};
let otakReady = false;
function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function getKata(row){ return norm(row.kata || row.kata_utama || row.topik || row.kalimat || row.teks || ''); }
function getJenis(row){ return norm(row.jenis || row.jenis_jawaban || row.kategori || ''); }
async function bacaTabel(nama){
  try{
    let res = await supabaseClient.from(nama).select('*').limit(500);
    if(!res.error) return res.data || [];
  }catch(e){}
  try{
    let r2 = await fetch(SUPABASE_URL + '/rest/v1/' + nama + '?select=*&limit=500', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
    if(!r2.ok) return [];
    return await r2.json();
  }catch(e2){ return []; }
}
async function getOtak(){
  if(otakReady) return DB;
  statusEl.textContent = 'Menghubungi Supabase...';
  const daftarTabel = ['kata','kata_angka','kata_benda','kata_ganti','kata_jawab','kata_kerja','kata_orang','kata_penunjuk','kata_sambung','kata_sapa','kata_sehari_hari','kata_sifat','kata_tanya','kata_tempat','kata_waktu','mona_aturan','mona_jawaban','mona_kata','pasangan_kata','perasaan','sinonim','tanda','topik_obrolan','tujuan','anonim','kalimat_hasil','aturan_tatar'];
  for(let t of daftarTabel){ DB[t] = await bacaTabel(t); }
  otakReady = true;
  let total = 0; for(let t of daftarTabel) total += (DB[t]?.length||0);
  if(total===0){
    statusEl.textContent = 'Semua tabel gagal dibaca, cek RLS / nama tabel ⚠️ Tapi chat tetep jalan - Cek Console (F12) buat liat error aslinya';
    statusEl.style.background = '#f8d7da';
  } else {
    statusEl.textContent = 'Ke-load ✅ Total '+total+' baris • MonaKata '+(DB.mona_kata?.length||0)+' • Aturan '+(DB.mona_aturan?.length||0)+' • KataSapa '+(DB.kata_sapa?.length||0)+' • KataKerja '+(DB.kata_kerja?.length||0)+' • Pasangan '+(DB.pasangan_kata?.length||0);
    statusEl.style.background = '#d4edda';
  }
  return DB;
}
function semuaKata(){
  let gabung = [];
  const sumber = ['mona_kata','mona_jawaban','kata','kata_sapa','kata_tanya','kata_kerja','kata_benda','kata_sifat','kata_ganti','kata_jawab','kata_orang','kata_tempat','kata_waktu','kata_penunjuk','kata_sambung','kata_angka','kata_sehari_hari','perasaan','tanda','tujuan','anonim'];
  for(let s of sumber){ for(let r of (DB[s]||[])){ let k = getKata(r); let j = getJenis(r) || s.replace('kata_',''); if(k) gabung.push({kata:k, jenis:j, sumber:s}); } }
  return gabung;
}
function rangkaiDariPola(pola){
  if(!pola) return null;
  let jenisList = pola.split('+').map(x=>norm(x)).filter(x=>x);
  let gudang = semuaKata();
  let hasil = [];
  for(let jenis of jenisList){
    let calon = gudang.filter(k=>k.jenis===jenis);
    if(!calon.length) calon = gudang.filter(k=>k.sumber==='kata_'+jenis);
    if(calon.length){ let pilih = calon[Math.floor(Math.random()*calon.length)]; hasil.push(pilih.kata); }
  }
  if(!hasil.length) return null;
  return { teks: hasil.join(' '), polaDipakai: pola, jenisDipakai: jenisList };
}
function cariPolaMona(nq){
  let semuaAturan = [...(DB.mona_aturan||[]), ...(DB.aturan_tatar||[])];
  if(!semuaAturan.length) return null;
  let best = null, bestSkor = 0;
  for(let a of semuaAturan){
    let kunci = norm(a.arah_pertanyaan || a.pola || '').split(' ').filter(x=>x.length>2);
    let cocok = kunci.filter(k=>nq.includes(' '+k+' ')).length;
    if(cocok > bestSkor){ bestSkor = cocok; best = a; }
  }
  return best ? { aturan: best, skor: bestSkor } : null;
}
function cariPasangan(nq){
  for(let p of (DB.pasangan_kata||[])){
    let k1 = norm(p.kata1), k2 = norm(p.kata2);
    if(k1 && nq.includes(' '+k1+' ')) return { teks: k2, polaDipakai: 'pasangan_kata:'+k1+'->'+k2, jenisDipakai: [k1,k2] };
  }
  return null;
}
function cariTopik(nq){
  for(let t of (DB.topik_obrolan||[])){
    let topik = norm(t.topik); let kataTopik = norm(t.kata);
    if(topik && nq.includes(' '+topik+' ')) return { teks: 'Oh soal '+topik+' ya Kak? '+ (kataTopik||''), polaDipakai: 'topik:'+topik, jenisDipakai: [topik] };
  }
  return null;
}
function jawab4Aturan(q){
  let nq = ' ' + norm(q) + ' ';
  if(!nq.includes(' ngopi ')) return null;
  let kerja = (DB.kata_kerja||[]).find(r => norm(r.kata)==='ngopi');
  let butuh = kerja ? norm(kerja.butuh_objek || kerja.butuh || '') : 'kopi';
  let calonBenda = (DB.kata_benda||[]).filter(r => {
    let kat = norm(r.kategori || r.jenis || '');
    let kata = norm(r.kata);
    return kat === butuh || kata === butuh;
  });
  let benda = calonBenda.length ? calonBenda[Math.floor(Math.random()*calonBenda.length)] : { kata: 'kopi' };
  let namaBenda = norm(benda.kata) || 'kopi';
  let sifatBoleh = ['manis','pahit','enak','panas','dingin','kental'];
  let calonSifat = (DB.kata_sifat||[]).filter(r => {
    let kata = norm(r.kata);
    let cocok = norm(r.cocok_untuk || r.cocok || r.kategori || '');
    return sifatBoleh.includes(kata) && (cocok==='' || cocok.includes('minuman') || cocok.includes('makanan') || cocok.includes('kopi'));
  });
  if(!calonSifat.length) calonSifat = sifatBoleh.map(k=>({kata:k}));
  let sifat = calonSifat[Math.floor(Math.random()*calonSifat.length)];
  let namaSifat = norm(sifat.kata);
  let calonTempat = (DB.kata_tempat||[]).filter(r => {
    let cocok = norm(r.cocok_untuk || r.cocok_untuk_verb || r.kategori || '');
    return cocok==='' || cocok.includes('ngopi');
  });
  if(!calonTempat.length) calonTempat = [{kata:'warung'},{kata:'rumah'},{kata:'kafe'}];
  let tempat = calonTempat[Math.floor(Math.random()*calonTempat.length)];
  let namaTempat = norm(tempat.kata);
  return {
    teks: 'Mona: ' + namaBenda + ' yang ' + namaSifat + ' di ' + namaTempat + ', Kak.',
    polaDipakai: '4-aturan: ngopi->'+namaBenda+' + sifat-minuman:'+namaSifat+' + tempat-ngopi:'+namaTempat,
    jenisDipakai: ['kata_kerja','kata_benda','kata_sifat','kata_tempat']
  };
}
function jawabPunyaAlternatif(q){
  let nq = ' ' + norm(q) + ' ';
  if(!nq.includes(' punya ')) return null;
  if(!nq.includes(' gak ') && !nq.includes(' ga ') && !nq.includes(' nggak ') && !nq.includes(' tidak ') && !nq.includes(' ada ')) return null;
  let m = nq.match(/ punya ([a-z ]+?)( gak| ga| nggak| tidak| ada|$)/);
  let barang = m ? norm(m[1]) : '';
  barang = barang.replace(/\b(lu|kamu|mona|mon|lo|ko|kak|luu)\b/g,' ').trim().split(' ').filter(x=>x).pop() || '';
  if(!barang) return null;
  const alternatifMap = {
    'duit': 'cara cari duit', 'uang': 'cara cari uang', 'motor': 'cara jalan kaki / naik angkot bareng',
    'mobil': 'cara naik angkot / nebeng bareng', 'pacar': 'cara kenalan sama orang baru',
    'kerjaan': 'cara cari kerjaan', 'kerja': 'cara cari kerja', 'rumah': 'cara nabung buat rumah',
    'hp': 'cara benerin hp lama Ko', 'pulsa': 'cara cari wifi gratisan', 'kuota': 'cara cari wifi gratisan',
    'makan': 'cara masak dari bahan yang ada', 'makanan': 'cara masak dari bahan yang ada',
    'kopi': 'cara bikin kopi sachet yang enak', 'waktu': 'cara atur waktu biar sempet', 'ide': 'cara cari ide bareng-bareng',
  };
  const orangMap = {
    'sodara': 'dengerin cerita soal sodara Ko', 'saudara': 'dengerin cerita soal saudara Ko',
    'kakak': 'dengerin cerita soal kakak Ko', 'adik': 'dengerin cerita soal adik Ko',
    'abang': 'dengerin cerita soal abang Ko', 'teman': 'jadi temen ngobrol Ko', 'temen': 'jadi temen ngobrol Ko',
    'pacar': 'dengerin cerita soal pacar Ko', 'suami': 'dengerin cerita soal suami Ko',
    'istri': 'dengerin cerita soal istri Ko', 'anak': 'dengerin cerita soal anak Ko',
    'ibu': 'dengerin cerita soal ibu Ko', 'bapak': 'dengerin cerita soal bapak Ko',
    'ayah': 'dengerin cerita soal ayah Ko', 'mama': 'dengerin cerita soal mama Ko', 'papa': 'dengerin cerita soal papa Ko',
  };
  if(orangMap[barang]){
    return { teks: 'Kalau ' + barang + ' gw gak punya, Kak. Tapi kalau ' + orangMap[barang] + ', gw bisa kok.', polaDipakai: 'punya-alternatif-orang: punya ' + barang, jenisDipakai: ['punya', barang, 'alternatif-orang'] };
  }
  let alternatif = alternatifMap[barang] || ('cara mikirin ' + barang + ' bareng-bareng');
  return { teks: 'Kalau ' + barang + ' gw gak punya, Kak. Tapi kalau ' + alternatif + ', gw bisa ikut mikir.', polaDipakai: 'punya-alternatif: punya ' + barang, jenisDipakai: ['punya', barang, 'alternatif'] };
}
// === OTAK BARU 3 - ORANG + SIFAT + GAK ===
// Contoh: Saudara lu cantik gak? Kakak lu ganteng gak? Pacar lu baik gak?
// Rumus: Mona gak punya orang itu -> gak bisa nilai -> balik tanya soal orang-nya Ko
function jawabOrangSifat(q){
  let nq = ' ' + norm(q) + ' ';
  if(nq.includes(' punya ')) return null;
  if(!nq.includes(' gak ') && !nq.includes(' ga ') && !nq.includes(' nggak ') && !nq.includes(' kah ') && !nq.includes(' ya ')) return null;
  let daftarOrang = ['saudara','sodara','kakak','adik','abang','kaka','pacar','teman','temen','suami','istri','anak','ibu','bapak','ayah','mama','papa','bos','tetangga','kawan','doi','mantan'];
  let orang = daftarOrang.find(o => nq.includes(' '+o+' '));
  if(!orang) return null;
  // Cari sifatnya: kata di antara orang dan gak
  let m = nq.match(new RegExp(orang + ' (?:lu |kamu |lo |ko |mona |mon )?([a-z ]+?)( gak| ga| nggak| kah| ya|$)'));
  let sifat = m ? norm(m[1]) : '';
  // Buang kata lu/kamu
  sifat = sifat.replace(/\b(lu|kamu|lo|ko|mona|mon)\b/g,' ').trim();
  if(!sifat) sifat = 'gitu';
  return {
    teks: 'Gw gak punya ' + orang + ', Kak. Jadi gw gak bisa bilang ' + sifat + ' apa enggak. Tapi kalau ' + orang + ' Ko yang ' + sifat + ', ceritain dong!',
    polaDipakai: 'orang-sifat: ' + orang + ' + ' + sifat + ' -> gak punya orang, balik tanya',
    jenisDipakai: ['kata_orang', 'kata_sifat', 'alternatif']
  };
}
function cariJawaban(q){
  let nq = ' ' + norm(q) + ' ';
  let j4 = jawab4Aturan(q);
  if(j4) return j4;
  let jPunya = jawabPunyaAlternatif(q);
  if(jPunya) return jPunya;
  let jOrangSifat = jawabOrangSifat(q);
  if(jOrangSifat) return jOrangSifat;
  for(let s of (DB.sinonim||[])){
    let utama = norm(s.kata_utama);
    let list = String(s.daftar_sinonim||'').toLowerCase().split(/[,|]/).map(x=>norm(x));
    for(let sin of list){ if(sin && nq.includes(' '+sin+' ')) nq = nq.replace(' '+sin+' ', ' '+utama+' '); }
  }
  let pas = cariPasangan(nq);
  if(pas) return { teks: pas.teks.charAt(0).toUpperCase()+pas.teks.slice(1)+', Kak.', polaDipakai: pas.polaDipakai, jenisDipakai: pas.jenisDipakai };
  let hasilPola = cariPolaMona(nq);
  if(hasilPola && hasilPola.aturan && hasilPola.aturan.pola){
    let rangkai = rangkaiDariPola(hasilPola.aturan.pola);
    if(rangkai){
      let final = rangkai.teks.charAt(0).toUpperCase() + rangkai.teks.slice(1);
      return { teks: final + ', Kak. Ada lagi yang mau Kakak tanya?', polaDipakai: rangkai.polaDipakai, jenisDipakai: rangkai.jenisDipakai };
    }
  }
  let top = cariTopik(nq);
  if(top) return top;
  if(DB.kalimat_hasil && DB.kalimat_hasil.length){
    for(let kh of DB.kalimat_hasil){
      let kal = norm(kh.kalimat || kh.teks || '');
      if(kal && nq.split(' ').some(w=>w.length>3 && kal.includes(w))) return { teks: kh.kalimat || kh.teks, polaDipakai: 'kalimat_hasil (contoh)', jenisDipakai: [getJenis(kh)] };
    }
  }
  return null;
}
function analisaSalah(pertanyaan, jawabanObj){
  let nq = ' ' + norm(pertanyaan) + ' ';
  let analisa = [];
  analisa.push('<b>🔍 Mona bedah salahnya:</b><br>');
  if(jawabanObj && jawabanObj.polaDipakai){
    analisa.push('1. Pola yang gw pake: <b>'+jawabanObj.polaDipakai+'</b><br>');
    analisa.push('2. Jenis yang gw ambil: <b>'+(jawabanObj.jenisDipakai||[]).join(' + ')+'</b><br>');
    let kataDiPertanyaan = nq.trim().split(' ');
    let gudang = semuaKata();
    for(let k of kataDiPertanyaan){
      let diDB = gudang.find(x=>x.kata===k);
      if(diDB) analisa.push('- Kata <b>'+k+'</b> di DB jenisnya: <b>'+diDB.jenis+'</b> (dari '+diDB.sumber+'). Bener gak Ko?<br>');
      else if(k.length>2) analisa.push('- Kata <b>'+k+'</b> GAK ADA di gudang kata. Berarti gw nebak.<br>');
    }
    analisa.push('<br>3. Jadi salah gw BUKAN di kalimatnya, tapi di <b>jenis / pola / skor</b> di atas.<br>');
    analisa.push('Ko gak perlu kasih kalimat benernya. Ko cukup bilang: "jenis ayolah salah" atau "pola nya salah".');
  } else {
    analisa.push('Gw gak nemu pola yang cocok.<br>');
    analisa.push('Berarti bukan kalimatnya yang kurang, tapi <b>pola / kata</b> nya yang belum ada / skornya kalah.<br>');
    analisa.push('Cek: kata di pertanyaan Ko ada di mona_kata / kata_sapa / kata_kerja gak? Pola di mona_aturan ada yang nyambung gak?');
  }
  return analisa.join('');
}
async function tandaiSalah(btn, pertanyaan, jawabanObj, jawabanTeks){
  let box = btn.parentElement.querySelector('.analisa');
  if(box){ box.remove(); btn.textContent = '❌ Salah - Cari Salahnya'; return; }
  let div = document.createElement('div');
  div.className = 'analisa';
  div.innerHTML = analisaSalah(pertanyaan, jawabanObj);
  btn.parentElement.appendChild(div);
  btn.textContent = 'Tutup Analisa';
}
function tambah(teks, siapa, pertanyaanAsli, jawabanObj){
  let row = document.createElement('div');
  row.className = 'row ' + (siapa==='me'?'me':'');
  if(siapa==='bot'){
    row.innerHTML = '<img src="mona.png" class="avatar" onerror="this.src=\'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100\'"><div class="msg bot"></div>';
    row.querySelector('.msg').innerHTML = teks;
    if(pertanyaanAsli){
      let btn = document.createElement('button');
      btn.className = 'btn-salah';
      btn.textContent = '❌ Salah - Cari Salahnya';
      btn.onclick = ()=>tandaiSalah(btn, pertanyaanAsli, jawabanObj, teks);
      row.querySelector('.msg').appendChild(document.createElement('br'));
      row.querySelector('.msg').appendChild(btn);
    }
  } else {
    row.innerHTML = '<div class="msg me"></div>';
    row.querySelector('.msg').textContent = teks;
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}
async function kirim(){
  let teks = input.value.trim();
  if(!teks) return;
  tambah(teks, 'me');
  input.value = '';
  let rowBot = tambah('Mona lagi mikir...', 'bot');
  let botMsg = rowBot.querySelector('.msg');
  if(!otakReady){ await getOtak(); }
  let jawabanObj = null;
  try{ jawabanObj = cariJawaban(teks); }catch(e){ console.log('cariJawaban error:', e); jawabanObj = null; }
  if(!jawabanObj){
    let jawaban = 'Halo kak, aku Mona 🙏<br><br>Untuk "'+teks+'" aku belum nemu pola / katanya di gudang. Boleh ceritain lebih detail nggak kak?';
    botMsg.innerHTML = jawaban;
    let btn = document.createElement('button');
    btn.className = 'btn-salah';
    btn.textContent = '❌ Salah - Cari Salahnya';
    btn.onclick = ()=>tandaiSalah(btn, teks, null, jawaban);
    botMsg.appendChild(document.createElement('br'));
    botMsg.appendChild(btn);
  } else {
    botMsg.innerHTML = jawabanObj.teks;
    let btn = document.createElement('button');
    btn.className = 'btn-salah';
    btn.textContent = '❌ Salah - Cari Salahnya';
    btn.onclick = ()=>tandaiSalah(btn, teks, jawabanObj, jawabanObj.teks);
    botMsg.appendChild(document.createElement('br'));
    botMsg.appendChild(btn);
  }
  chat.scrollTop = chat.scrollHeight;
}
input.addEventListener('keydown', e=>{ if(e.key==='Enter') kirim(); });
tambah('Halo kak, aku Mona 🙏<br>Ada yang bisa aku bantu?', 'bot');
getOtak();
</script>
</body>
</html>
