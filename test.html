async function cobaAmbil(namaList, selectCols){
  for(let nama of namaList){
    try{
      let r = await Promise.race([supabaseClient.from(nama).select(selectCols).limit(1), timeout(3000)]);
      if(r && !r.error && r.data){
        console.log('✅ Tabel ketemu:', nama);
        let r2 = await Promise.race([supabaseClient.from(nama).select(selectCols).limit(1000), timeout(5000)]);
        if(r2 && !r2.error) return {nama: nama, data: r2.data || []};
        return {nama: nama, data: r.data || []};
      } else {
        console.log('❌ Tabel', nama, 'gagal:', r?.error?.message);
      }
    }catch(e){ console.log('❌ Tabel', nama, 'error:', e.message); }
  }
  return {nama: null, data: []};
}

function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function cariJawabanV5(q, otak){
  let nq = norm(q);
  let stop = ['boleh','tau','tahu','dong','kak','ya','kah','sih','nya','apa','dimana','di','mana','berapa','gimana','mau','tanya','tolong','kasih','kasi','info'];
  let kataUser = nq.split(' ').filter(w => w.length > 2 && !stop.includes(w));
  if(!kataUser.length) kataUser = nq.split(' ').filter(w=>w.length>2);
  let best = null, bestScore = 0;
  for(let r of otak){
    let frasas = String(r.keyword||'').toLowerCase().split('|').map(x=>norm(x)).filter(Boolean);
    for(let f of frasas){
      let kataKunci = f.split(' ').filter(w => w.length > 2);
      let cocok = 0;
      for(let k of kataKunci){ if(kataUser.some(u => u.includes(k) || k.includes(u))) cocok++; }
      let skor = kataKunci.length ? (cocok / kataKunci.length) * 100 : 0;
      if(nq.includes(f)) skor += 20;
      if(skor > bestScore){ bestScore = skor; best = r; }
    }
  }
  if(bestScore >= 50) return {answer: best.answer, skor: bestScore, keyword: best.keyword};
  return null;
}
