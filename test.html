<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONA - D' LUSSO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding:12px}
h1{text-align:center;color:#E8C97A;font-size:18px;letter-spacing:2px;margin:8px 0 2px}
.sub{text-align:center;color:#888;font-size:11px;margin-bottom:10px}
.card{background:#151515;border:1px solid #C9A86A;border-radius:14px;padding:12px;margin-top:10px}
.mona-head{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#1a1a1a;border:1px solid #C9A86A;border-radius:12px;margin-bottom:10px}
.mona-head img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #E8C97A}
.chat{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:#000;border-radius:10px;border:1px solid #333}
.msg{padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.4;max-width:92%}
.me{align-self:flex-end;background:#C9A86A;color:#000;font-weight:700}
.bot{align-self:flex-start;background:#222;color:#eee;border:1px solid #333}
.bot b{color:#E8C97A}
.row{display:flex;gap:8px}
input{flex:1;background:#0a0a0a;border:1px solid #C9A86A;color:#fff;padding:12px;border-radius:10px;font-size:13px;outline:none}
button{background:linear-gradient(180deg,#F5D98A,#C9A86A);border:none;padding:12px 16px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;color:#000}
.skorBox{background:#000;border:1px solid #FFD700;color:#FFD700;padding:10px;border-radius:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;margin-top:8px}
small{color:#888;font-size:11px}
</style></head><body>
<h1>👑 MONA - D' LUSSO</h1><div class="sub">100% MURNI DARI DATABASE | <span id="statusDb">Menghubungkan...</span></div>
<div class="card">
<div class="mona-head">
  <img src="mona.png" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100'">
  <div><b style="color:#E8C97A">Mona • D' LUSSO</b><br><span style="font-size:11px;color:#aaa">● Online • Hanya jawab dari database</span></div>
</div>
<div id="chatBody" class="chat"><div class="msg bot">Halo kak, saya Mona dari D'Lusso 🙏<br>Silakan tanya, saya jawab sesuai yang sudah diajarkan di database.</div></div>
<div class="row" style="margin-top:10px"><input id="chatInput" placeholder="Ketik pertanyaan..." onkeypress="if(event.key==='Enter') kirimChat()"><button onclick="kirimChat()">KIRIM →</button></div>
<div id="skorHasil" class="skorBox" style="display:none"></div>
<small>MONA tidak akan menjawab jika tidak ada di database. Tidak ada jawaban karangan.</small>
</div>
<script>
var SUPABASE_URL = 'https://msfzsebownnsrpyjusoc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_7VQcQXBLz4OYn_OJUzusSg_Zz1or9gq';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var ATURAN = [];
var FRASA_LIST = [];

// === NORMALISASI ANTI-TYPO - KAYA LU KO, SANTAI ===
function normalisasiTeks(t){
  var s=' '+String(t||'').toLowerCase()+' ';
  s=s.replace(/[^a-z0-9\s]/g,' ');
  s=s.replace(/\s+/g,' ');
  s=s.replace(/\bdi\s+([a-z]+)/g,'di$1');
  s=s.replace(/\bke\s+([a-z]+)/g,'ke$1');
  s=s.replace(/\s+/g,' ').trim();
  return ' '+s+' ';
}
// Hilangin huruf double: hallo->halo, sedihh->sedih, hargaa->harga
function hapusDouble(s){ return s.replace(/([a-z])\1+/g,'$1'); }
// Jarak typo: hallo vs halo = 1, labar vs kabar = 1, hrga vs harga = 1
function jarakTypo(a,b){
  a=hapusDouble(a); b=hapusDouble(b);
  if(a===b) return 0;
  var m=a.length, n=b.length;
  if(Math.abs(m-n)>2) return 99;
  var d=[]; for(var i=0;i<=m;i++) d[i]=[i];
  for(var j=0;j<=n;j++) d[0][j]=j;
  for(var i=1;i<=m;i++) for(var j=1;j<=n;j++){
    var cost = a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
  }
  return d[m][n];
}
// Cek 1 kata: mirip apa nggak? Toleransi 1-2 huruf salah
function kataMirip(kataChat, kataFrasa){
  kataChat=hapusDouble(kataChat); kataFrasa=hapusDouble(kataFrasa);
  if(kataChat===kataFrasa) return true;
  if(kataChat.length<3 || kataFrasa.length<3) return false;
  // labar vs kabar: beda 1 huruf depan, tapi tetep mirip
  var j=jarakTypo(kataChat, kataFrasa);
  if(kataFrasa.length<=4) return j<=1;
  if(kataFrasa.length<=7) return j<=2;
  return j<=2;
}
// Cek frasa: semua kata di frasa harus ada (mirip) di chat
function frasaKenaTypo(chatNorm, frasaAsli){
  var f=normalisasiTeks(frasaAsli).trim(); if(!f) return false;
  var kataFrasa=f.split(/\s+/);
  var kataChat=chatNorm.trim().split(/\s+/);
  for(var i=0;i<kataFrasa.length;i++){
    var ketemu=false;
    for(var j=0;j<kataChat.length;j++){
      if(kataMirip(kataChat[j], kataFrasa[i])){ ketemu=true; break; }
    }
    if(!ketemu) return false;
  }
  return true;
}
function ambilTeksFrasa(row){
  return row.teks || row.frasa || row.kata || row.kalimat || row.isi || row.pertanyaan || row.text || '';
}
function hitungSkorBaru(chat){
  var n=normalisasiTeks(chat);
  var perKategori={};
  for(var i=0;i<FRASA_LIST.length;i++){
    var kat=FRASA_LIST[i].kategori||'lain';
    if(!perKategori[kat]) perKategori[kat]={total:0, maks:0, kena:[]};
    perKategori[kat].maks+=1;
    var teks=ambilTeksFrasa(FRASA_LIST[i]);
    if(frasaKenaTypo(n, teks)){
      perKategori[kat].total+=1;
      perKategori[kat].kena.push(teks);
    }
  }
  var hasil=[];
  for(var k in perKategori){
    var d=perKategori[k];
    var persen=d.maks>0?(d.total/d.maks*100):0;
    var rule=null;
    for(var j=0;j<ATURAN.length;j++){ if(ATURAN[j].kategori===k){ rule=ATURAN[j]; break; } }
    if(rule) hasil.push({kategori:k, rule:rule, skor:{total:d.total, skorMaks:d.maks, persen:persen, kenaFrasa:d.kena}});
  }
  hasil.sort(function(a,b){ return b.skor.total-a.skor.total; });
  return hasil;
}
async function loadSemua(){
  document.getElementById('statusDb').textContent='Memuat dari database...';
  try{
    var r1=await sb.from('bot_rules').select('*').order('id');
    if(r1.error) throw r1.error;
    ATURAN=r1.data||[];
    var r2=await sb.from('frasa').select('*').order('id');
    if(r2.error) throw r2.error;
    FRASA_LIST=r2.data||[];
    document.getElementById('statusDb').textContent='✅ '+ATURAN.length+' aturan + '+FRASA_LIST.length+' frasa dari database';
  }catch(e){
    ATURAN=[]; FRASA_LIST=[];
    document.getElementById('statusDb').textContent='❌ Gagal: '+e.message+' (Cek RLS / POLICY!)';
  }
}
function tambahChat(teks, siapa){
  var body=document.getElementById('chatBody');
  var d=document.createElement('div'); d.className='msg '+(siapa==='me'?'me':'bot'); d.innerHTML=teks; body.appendChild(d); body.scrollTop=body.scrollHeight;
}
async function kirimChat(){
  var inp=document.getElementById('chatInput'); var teks=inp.value.trim(); if(!teks) return;
  tambahChat(teks, 'me'); inp.value='';
  if(!ATURAN.length || !FRASA_LIST.length){
    tambahChat('Maaf kak, database belum terhubung / belum ada aturan. Mona tidak bisa menjawab karena tidak ada di database 🙏', 'bot');
    return;
  }
  var hasil = hitungSkorBaru(teks);
  var box=document.getElementById('skorHasil'); box.style.display='block';
  var txt='PERTANYAAN: '+teks+'\nNORMALISASI: '+normalisasiTeks(teks).trim()+'\n\n=== HASIL ANTI-TYPO ===\n';
  for(var i=0;i<hasil.length;i++){ var h=hasil[i].skor; txt+='\n['+(i+1)+'] '+hasil[i].kategori+' | TOTAL: '+h.total+' / Maks: '+h.skorMaks+' = '+h.persen.toFixed(1)+'% '+(h.total>=1?'✅ LOLOS':'❌ GAK LOLOS')+'\nFrasa kena: '+(h.kenaFrasa.length?h.kenaFrasa.join(', '):'(nggak kena)')+'\nJawaban DB: '+hasil[i].rule.jawaban+'\n'; }
  box.textContent=txt;
  var jawaban=null;
  if(hasil.length && hasil[0].skor.total>=1){ jawaban=hasil[0].rule.jawaban; }
  if(!jawaban){
    tambahChat('Maaf kak, pertanyaan itu belum ada di database Mona 🙏<br>Mona hanya menjawab sesuai yang sudah diajarkan.', 'bot');
    try{ await sb.from('bot_antrian').insert([{pertanyaan:teks, status:'MENUNGGU'}]); }catch(e){}
    return;
  }
  setTimeout(function(){ tambahChat(jawaban, 'bot'); }, 300);
}
loadSemua();
</script></body></html>
