<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MONA - Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{background:#ece5dd;display:flex;flex-direction:column;height:100dvh}
  #head{background:#111;padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
  #head img{width:40px;height:40px;border-radius:50%;object-fit:cover}
  #head b{font-size:16px}
  #head span{font-size:11px;color:#25d366}
  #status{font-size:11px;color:#888;text-align:center;padding:5px;background:#fff3cd}
  #chat{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;max-width:90%}
  .row.me{justify-content:flex-end;align-self:flex-end}
  .avatar{width:36px;height:36px;min-width:36px;border-radius:50%;object-fit:cover}
  .msg{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;word-break:break-word}
  .msg.bot{background:#fff;color:#111}
  .msg.me{background:#dcf8c6;color:#111}
  #box{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;z-index:99}
  #pesan{flex:1;padding:14px;border-radius:20px;border:1px solid #ddd;outline:none;font-size:15px;min-width:0}
  button{padding:12px 18px;border:none;border-radius:20px;background:#111;color:#fff;font-weight:bold;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="head">
  <img src="mona.png" onerror="this.src='https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100'">
  <div><b>MONA</b><br><span>● Online</span></div>
</div>
<div id="status">Memuat otak Mona...</div>
<div id="chat"></div>
<div id="box">
  <input id="pesan" placeholder="Ketik pesan..." autocomplete="off">
  <button onclick="kirim()">Kirim</button>
</div>
<script>
const SUPABASE_URL = 'https://msfzsebownnsrpyjusoc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7VQcQXBLz4OYn_OJUzusSg_Zz1or9gq';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const chat = document.getElementById('chat');
const input = document.getElementById('pesan');
const statusEl = document.getElementById('status');
let OTAK = [
  {pertanyaan:'lokasi dimana?', jawaban:'Kita di Jl. Merdeka No. 10 Bandung, deket Alun-alun kak. Patokannya Indomaret depan gang. Mau aku kirimin shareloc?', penentu:'lokasi|alamat|tempat|dimana', persamaan:'lokasi|alamat|tempat|dimana|daerah|letak|posisi|lokasinya|alamatnya|tempatnya|dimanakah|di mana|address', frasa:'lokasi|dimana|alamat|tempat|daerah|letak|posisi|lokasinya|alamatnya|tempatnya|di mana', skor:10},
  {pertanyaan:'jam buka jam berapa?', jawaban:'Kita buka tiap hari kak, jam 08.00 - 21.00 WIB. Mau mampir jam berapa? Biar aku siapin tempatnya!', penentu:'jam|buka|tutup', persamaan:'jam|buka|tutup|jadwal|operasional|buka jam|jam buka|jam berapa|open|close', frasa:'jam|buka|tutup|jadwal|operasional|jam berapa|buka jam berapa|jam kerja', skor:10},
  {pertanyaan:'berapa harga?', jawaban:'Harganya mulai 100rb kak, ada paket 100rb / 175rb / 250rb. Semua udah termasuk pajak. Kakak mau yang mana? Biar aku bantu pilihin!', penentu:'harga|biaya', persamaan:'harga|biaya|ongkos|bayar|tarif|mahar|bandrol|nominal|harganya|berapaan|berapa|price', frasa:'berapa|harga|biaya|ongkos|bayar|tarif|mahar|bandrol|nominal|harganya|berapaan|price', skor:10},
  {pertanyaan:'ada promo?', jawaban:'Lagi ada promo kak! Diskon 20% semua paket + beli 2 gratis 1. Promonya sampe Minggu aja. Mau aku amankan yang mana?', penentu:'promo|diskon', persamaan:'promo|diskon|potongan|murah|hemat|sale|voucher|kupon|obral|cuci gudang', frasa:'ada|promo|diskon|potongan|murah|hemat|sale|voucher|kupon|obral', skor:10},
];
let otakReady = false;
function timeout(ms){ return new Promise(r=>setTimeout(()=>r(null), ms)); }
async function getOtak(){
  if(otakReady) return OTAK;
  statusEl.textContent = 'Menghubungi Supabase...';
  try{
    let p1 = supabaseClient.from('bot_rules').select('pertanyaan,jawaban,penentu,penentu_gender,persamaan,frasa,skor');
    let r1 = await Promise.race([p1, timeout(4000)]);
    if(r1 && r1.data && r1.data.length){
      OTAK = r1.data;
      otakReady = true;
      statusEl.textContent = 'Otak siap: ' + OTAK.length + ' aturan • Supabase ✅';
      statusEl.style.background = '#d4edda';
      return OTAK;
    }
    throw new Error('Data kosong: ' + JSON.stringify(r1?.error));
  }catch(e){
    console.log('Supabase gagal:', e);
    statusEl.textContent = 'Supabase gagal, pake otak cadangan ⚠️ • ' + OTAK.length + ' aturan • ' + e.message;
    statusEl.style.background = '#f8d7da';
    otakReady = true;
    return OTAK;
  }
}
function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function cariJawaban(q, otak){
  let nq = norm(q);
  let sapaan = ['kakak','kak','bang','mas','mbak','bro','sis','min','mba'];
  let kataUser = nq.split(' ').filter(w => w.length > 1 && !sapaan.includes(w));
  let nqBersih = kataUser.join(' ');
  let best = null, bestScore = -1;
  for(let r of otak){
    let skor = 0;
    let penentuList = String(r.penentu||'').toLowerCase().split('|').map(x=>norm(x)).filter(Boolean);
    let cocokPenentu = 0;
    for(let p of penentuList){
      if(nqBersih.includes(p) || kataUser.some(u => u.includes(p) || p.includes(u))) cocokPenentu++;
    }
    if(cocokPenentu > 0) skor += cocokPenentu * 50;
    let persamaanList = String(r.persamaan||'').toLowerCase().split('|').map(x=>norm(x)).filter(Boolean);
    for(let p of persamaanList){ if(nqBersih.includes(p)) skor += 10; }
    let frasaList = String(r.frasa||'').toLowerCase().split('|').map(x=>norm(x)).filter(Boolean);
    for(let f of frasaList){ if(nqBersih.includes(f)) skor += 15; if(nqBersih === f) skor += 30; }
    skor += (r.skor || 0) * 0.1;
    if(skor > bestScore){ bestScore = skor; best = r; }
  }
  if(best && bestScore >= 50) return best.jawaban;
  return null;
}
function tambah(teks, siapa){
  let row = document.createElement('div');
  row.className = 'row ' + (siapa==='me'?'me':'');
  if(siapa==='bot'){
    row.innerHTML = '<img src="mona.png" class="avatar" onerror="this.src=\'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100\'"><div class="msg bot"></div>';
    row.querySelector('.msg').innerHTML = teks;
  } else {
    row.innerHTML = '<div class="msg me"></div>';
    row.querySelector('.msg').textContent = teks;
  }
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}
async function kirim(){
  let teks = input.value.trim();
  if(!teks) return;
  tambah(teks, 'me');
  input.value = '';
  let rowBot = tambah('Mona lagi mikir...', 'bot');
  let botMsg = rowBot.querySelector('.msg');
  let otak = OTAK;
  if(!otakReady){ otak = await getOtak(); }
  let jawaban = cariJawaban(teks, otak);
  if(!jawaban){
    jawaban = 'Halo kak, aku Mona 🙏<br><br>Untuk "'+teks+'" aku belum nemu jawabannya. Boleh ceritain lebih detail nggak kak?';
  }
  botMsg.innerHTML = jawaban;
  chat.scrollTop = chat.scrollHeight;
}
input.addEventListener('keydown', e=>{ if(e.key==='Enter') kirim(); });
tambah('Halo kak, aku Mona 🙏<br>Ada yang bisa aku bantu?', 'bot');
getOtak();
</script>
</body>
</html>
